<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balina">
<meta name="theme-color" content="#03101a">
<title>Balina Avcısı — Mobil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --abyss:#03101a; --deep:#071e2c; --panel:#0b2739; --panel2:#0a2130;
    --line:#164257; --foam:#e9f5fb; --mist:#6d97ad; --dim:#3d6478;
    --sonar:#2ff5c8; --alarm:#ff5470; --amber:#ffc24b; --whale:#4a90d9;
    --violet:#9d7bff; --veto:#ff8a3d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--abyss);color:var(--foam);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
    padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 20px);
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 12px}
  .top h1{font-size:14px;font-weight:700;letter-spacing:2px}
  .dur{font-size:10px;color:var(--mist);display:flex;align-items:center;gap:5px}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--sonar);animation:p 2.4s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}

  /* FİYAT — en büyük öğe */
  .fiyat-kart{background:linear-gradient(165deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px;text-align:center}
  .fiyat{font-size:42px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
  .fiyat-alt{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:13px;font-weight:600}

  /* SİNYAL — dev rozet */
  .sinyal-kart{border-radius:16px;padding:22px 20px;margin-bottom:12px;text-align:center;border:2px solid}
  .sinyal-buyuk{font-size:32px;font-weight:800;letter-spacing:3px;line-height:1}
  .sinyal-alt{font-size:12px;margin-top:8px;opacity:.85;line-height:1.5}

  /* REJİM */
  .rejim{border-radius:14px;padding:16px 18px;margin-bottom:12px;border:1px solid}
  .rejim-ad{font-size:16px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
  .rejim-not{font-size:12px;color:var(--mist);line-height:1.55}

  /* SÜREÇ */
  .surec{border-radius:14px;padding:16px 18px;margin-bottom:12px;border:1px solid}
  .surec-ust{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .surec-ad{font-size:13px;font-weight:700;letter-spacing:.8px}
  .surec-sure{font-size:11px;color:var(--mist)}
  .olg-bar{height:10px;background:var(--deep);border-radius:5px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px}
  .olg-fill{height:100%;border-radius:5px;transition:width .5s}
  .tuk-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:10.5px}
  .tuk{display:flex;align-items:center;gap:6px;color:var(--dim)}
  .tuk.on{color:var(--foam);font-weight:600}
  .tuk i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}

  /* GRID veriler */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kutu{background:linear-gradient(165deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:14px;padding:14px;position:relative;overflow:hidden}
  .kutu::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--whale)}
  .kutu.pos::before{background:var(--sonar)} .kutu.neg::before{background:var(--alarm)}
  .kutu.warn::before{background:var(--amber)} .kutu.neu::before{background:var(--mist)}
  .kutu.violet::before{background:var(--violet)}
  .k-lbl{font-size:9px;color:var(--mist);text-transform:uppercase;letter-spacing:1.1px;margin-bottom:7px}
  .k-val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  .k-sub{font-size:9.5px;color:var(--mist);margin-top:5px;line-height:1.4}
  .k-val.pos{color:var(--sonar)} .k-val.neg{color:var(--alarm)}
  .k-val.warn{color:var(--amber)} .k-val.neu{color:var(--foam)}
  .k-val.violet{color:var(--violet)}

  /* DUVARLAR */
  .bolum-bas{font-size:10px;color:var(--whale);text-transform:uppercase;letter-spacing:1.5px;
    margin:18px 0 10px;padding-left:2px}
  .duvar{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;margin-bottom:7px}
  .d-fiyat{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px}
  .d-bar{flex:1;height:7px;background:var(--deep);border-radius:4px;overflow:hidden}
  .d-bar i{display:block;height:100%;border-radius:4px}
  .d-usd{font-size:10.5px;color:var(--mist);min-width:50px;text-align:right}
  .d-mut{font-size:8.5px;padding:2px 6px;border:1px solid;border-radius:4px;min-width:46px;text-align:center}

  /* KATMANLAR */
  .katman{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;margin-bottom:7px}
  .kat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .kat-ad{flex:1;font-size:12px;font-weight:600}
  .kat-ad small{display:block;font-size:9px;color:var(--dim);font-weight:400;margin-top:2px}
  .kat-dur{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap}

  /* İSABET */
  .isabet{background:linear-gradient(165deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
  .is-oran{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .is-txt{font-size:11px;color:var(--mist);line-height:1.5}

  .yenile{width:100%;background:var(--deep);color:var(--sonar);border:1px solid var(--line);
    padding:15px;border-radius:13px;font-size:14px;font-weight:600;font-family:inherit;
    margin-top:8px;cursor:pointer;-webkit-appearance:none}
  .yenile:active{background:var(--panel);transform:scale(.98)}
  .err{background:rgba(255,84,112,.12);border:1px solid var(--alarm);color:#ffd0d8;
    padding:14px;border-radius:12px;font-size:12px;margin-bottom:12px;line-height:1.5}
  .not{font-size:9.5px;color:var(--dim);text-align:center;margin-top:16px;line-height:1.6}
  .yukleniyor{text-align:center;padding:50px 20px;color:var(--mist);font-size:13px}
</style>
</head>
<body>
  <div class="top">
    <h1>BALİNA AVCISI</h1>
    <div class="dur" id="dur"><span class="pulse"></span>Yükleniyor…</div>
  </div>

  <div id="err"></div>
  <div id="icerik"><div class="yukleniyor">Veri çekiliyor…</div></div>

  <button class="yenile" onclick="load()">↻ Yenile</button>
  <div class="not">Saatler UTC+3 · Otomatik yenileme 60sn<br>Yatırım tavsiyesi değildir</div>

<script>
const SUPABASE_URL="https://aojhyiiiwllgvgglzokz.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvamh5aWlpd2xsZ3ZnZ2x6b2t6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NDI0NzYsImV4cCI6MjA5OTAxODQ3Nn0.bMbWJr8uIwbuumLIWMphgs5gWUb_nlrGUDRK8_TM5N8";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const fmt=(n,d=0)=>n==null||isNaN(n)?"—":Number(n).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});
const big=(n)=>{if(n==null||isNaN(n))return"—";const a=Math.abs(n);
  if(a>=1e9)return(n<0?"-":"")+"$"+(a/1e9).toFixed(2)+"B";
  if(a>=1e6)return(n<0?"-":"")+"$"+(a/1e6).toFixed(1)+"M";
  if(a>=1e3)return(n<0?"-":"")+"$"+(a/1e3).toFixed(0)+"K";return"$"+n.toFixed(0);};
const bigS=(n)=>{if(n==null||isNaN(n))return"—";const s=n<0?"-":"+";const a=Math.abs(n);
  if(a>=1e6)return s+(a/1e6).toFixed(2)+"M";
  if(a>=1e3)return s+(a/1e3).toFixed(0)+"K";return s+a.toFixed(0);};

const REJIMLER={
  TAZE_ALIM:{r:'var(--sonar)',bg:'rgba(47,245,200,.10)',ad:'TAZE ALIM',n:'Fiyat çıkıyor, açık pozisyon artıyor — gerçek yeni para. Sağlıklı yükseliş.'},
  SHORT_SQUEEZE:{r:'var(--veto)',bg:'rgba(255,138,61,.10)',ad:'SHORT SQUEEZE',n:'Fiyat çıkıyor ama OI düşüyor — shortlar zorla kapanıyor. Kırılgan; LONG kesildi.'},
  TAZE_SATIS:{r:'var(--alarm)',bg:'rgba(255,84,112,.10)',ad:'TAZE SATIŞ',n:'Fiyat düşüyor, OI artıyor — yeni shortlar geliyor. Gerçek satış baskısı.'},
  LONG_TASFIYE:{r:'var(--veto)',bg:'rgba(255,138,61,.10)',ad:'LONG TASFİYE',n:'Fiyat düşüyor, OI düşüyor — longlar zorla kapanıyor. Kırılgan; SHORT kesildi.'},
  DIP_TOPLAMA:{r:'var(--sonar)',bg:'rgba(47,245,200,.10)',ad:'DİP TOPLAMA',n:'Satış akışı olgun alım duvarınca emiliyor — birileri sessizce topluyor olabilir.'},
  TEPE_DAGITIM:{r:'var(--alarm)',bg:'rgba(255,84,112,.10)',ad:'TEPE DAĞITIM',n:'Alım akışı satım duvarınca karşılanıyor — birileri sessizce dağıtıyor olabilir.'},
  VERI_GUVENSIZ:{r:'var(--amber)',bg:'rgba(255,194,75,.10)',ad:'VERİ GÜVENSİZ',n:'CVD güvenilir kaynaktan gelmiyor ya da veri bozuk. Koruma modu — sinyal üretilmiyor.'},
  VERI_BEKLENIYOR:{r:'var(--mist)',bg:'rgba(111,156,181,.08)',ad:'ISINMA',n:'Değişim penceresi henüz dolmadı. Sistem veri biriktiriyor.'},
  NOTR:{r:'var(--mist)',bg:'rgba(111,156,181,.08)',ad:'NÖTR',n:'Belirgin order-flow paterni yok. Piyasa kararsız/sakin.'}
};

function pencere(rows){
  if(rows.length<4)return null;
  const L=rows[rows.length-1];
  const hedef=new Date(L.kayit_zamani).getTime()-5*60*1000;
  let e=null;
  for(let i=rows.length-1;i>=0;i--){
    if(new Date(rows[i].kayit_zamani).getTime()<=hedef){e=rows[i];break;}
  }
  if(!e)e=rows[0];
  const dt=(new Date(L.kayit_zamani)-new Date(e.kayit_zamani))/1000;
  if(dt<120||!e.anlik_fiyat)return null;
  const dF=(L.anlik_fiyat/e.anlik_fiyat-1)*100;
  const dV=(L.vadeli_cvd||0)-(e.vadeli_cvd||0);
  const dS=(L.spot_cvd||0)-(e.spot_cvd||0);
  const dOI=e.open_interest?(L.open_interest/e.open_interest-1)*100:0;
  const clip=(x,lo,hi)=>Math.max(0,Math.min(1,(x-lo)/(hi-lo)));
  const satis=clip(-dV,0,3000),alis=clip(dV,0,3000);
  const dirL=clip(dF,-.20,.10),zayS=clip(-dF,-.20,.10);
  const bidB=clip(L.order_book_depth_bid_1pct||0,22.5e6,67.5e6);
  const askB=clip(L.order_book_depth_ask_1pct||0,22.5e6,67.5e6);
  const olg=y=>y<=60?.30:y>=300?1:.30+.70*(y-60)/240;
  const dvL=satis<.15?.35:bidB*olg(L.en_olgun_emir_yasi_sn||0);
  const dvS=alis<.15?.35:askB*olg(L.en_olgun_ask_yasi_sn||0);
  return {dF,dV,dS,dOI,satis,alis,
    absL:Math.pow(satis,.5)*Math.pow(dirL,.25)*Math.pow(dvL,.25),
    absS:Math.pow(alis,.5)*Math.pow(zayS,.25)*Math.pow(dvS,.25),
    teyitL:satis>=.15,teyitS:alis>=.15};
}

function rejimBul(L,p){
  if(L.open_interest==null||L.open_interest<1e9)return'VERI_GUVENSIZ';
  if(!p)return'VERI_BEKLENIYOR';
  if(p.dF>.02&&p.dOI>.05)return'TAZE_ALIM';
  if(p.dF>.02&&p.dOI<-.05)return'SHORT_SQUEEZE';
  if(p.dF<-.02&&p.dOI>.05)return'TAZE_SATIS';
  if(p.dF<-.02&&p.dOI<-.05)return'LONG_TASFIYE';
  if(p.absL>.45)return'DIP_TOPLAMA';
  if(p.absS>.45)return'TEPE_DAGITIM';
  return'NOTR';
}

function cvdKaynak(rows,alan){
  const s=rows.slice(-30).map(r=>Math.abs(r[alan]||0)).filter(v=>v>0).sort((a,b)=>a-b);
  return s.length?s[Math.floor(s.length/2)]>=10000:false;
}

async function load(){
  document.getElementById('dur').innerHTML='<span class="pulse"></span>Yenileniyor…';
  document.getElementById('err').innerHTML='';
  const {data,error}=await sb.from('balina_avcisi_data').select('*')
    .order('kayit_zamani',{ascending:false}).limit(120);
  if(error){
    document.getElementById('err').innerHTML=`<div class="err"><b>Bağlantı hatası</b><br>${error.message}</div>`;
    document.getElementById('dur').textContent='Hata';return;
  }
  if(!data||!data.length){
    document.getElementById('err').innerHTML='<div class="err">Kayıt yok.</div>';return;
  }

  const rows=data.slice().reverse();
  const L=rows[rows.length-1];
  const p=pencere(rows);
  const rj=rejimBul(L,p);
  const R=REJIMLER[rj]||REJIMLER.NOTR;

  // süreç
  let surec=null;
  try{
    const {data:sd}=await sb.from('balina_ayarlar').select('*').eq('anahtar','surec_durumu').limit(1);
    if(sd&&sd.length)surec=typeof sd[0].deger==='string'?JSON.parse(sd[0].deger):sd[0].deger;
  }catch(e){}

  const sig=(L.sinyal_durumu||'BEKLE').toUpperCase();
  const sRenk=sig==='LONG'?'var(--sonar)':sig==='SHORT'?'var(--alarm)':'var(--mist)';
  const sBg=sig==='LONG'?'rgba(47,245,200,.10)':sig==='SHORT'?'rgba(255,84,112,.10)':'rgba(111,156,181,.06)';
  const dF=p?p.dF:0;
  const ls=L.long_skor||0,ss=L.short_skor||0;
  const kanaat=Math.max(ls,ss);

  // duvarlar
  let bids=[],asks=[];
  try{bids=typeof L.yakin_likidite_bid==='string'?JSON.parse(L.yakin_likidite_bid):(L.yakin_likidite_bid||[]);}catch(e){}
  try{asks=typeof L.yakin_likidite_ask==='string'?JSON.parse(L.yakin_likidite_ask):(L.yakin_likidite_ask||[]);}catch(e){}
  const tum=[...asks.map(a=>({...a,t:'ask'})),...bids.map(b=>({...b,t:'bid'}))].sort((a,b)=>b.fiyat-a.fiyat);
  const maxU=Math.max(...tum.map(x=>x.usdt||0),1);

  // CVD kaynak güvenilirliği
  const vGuv=cvdKaynak(rows,'vadeli_cvd'), sGuv=cvdKaynak(rows,'spot_cvd');
  const vcd=L.vadeli_cvd||0, scd=L.spot_cvd||0;

  // isabet
  const iw=rows.filter(r=>r.is_win!=null);
  const win=iw.filter(r=>String(r.is_win).toLowerCase()==='true'||r.is_win===true).length;
  const isabetOran=iw.length?100*win/iw.length:0;
  const iRenk=isabetOran>=55?'var(--sonar)':isabetOran>=45?'var(--amber)':'var(--alarm)';

  const fund=L.funding_rate||0;
  const bid=L.order_book_depth_bid_1pct||0, ask=L.order_book_depth_ask_1pct||0;

  // SÜREÇ HTML
  let surecHtml='';
  if(surec&&surec.rejim&&surec.rejim!=='NOTR'){
    const dag=['TEPE_DAGITIM','SHORT_SQUEEZE','TAZE_ALIM'].includes(surec.rejim);
    const sr=dag?'var(--alarm)':'var(--sonar)';
    const olg=(surec.olgunluk||0)*100, tuk=surec.tukenme||0;
    const sinyaller=dag
      ?['Fiyat zirveden geri','Satım duvarı incelir','Funding aşırı+','Long likidasyonu']
      :['Fiyat dipten toparlar','Alım duvarı çekilir','Funding negatif','Short likidasyonu'];
    surecHtml=`<div class="surec" style="border-color:${sr};background:${dag?'rgba(255,84,112,.06)':'rgba(47,245,200,.06)'}">
      <div class="surec-ust">
        <span class="surec-ad" style="color:${sr}">${dag?'DAĞITIM':'TOPLAMA'} SÜRECİ</span>
        <span class="surec-sure">${(surec.sure_dk||0).toFixed(0)} dk · olgunluk %${olg.toFixed(0)}</span>
      </div>
      <div class="olg-bar"><div class="olg-fill" style="width:${olg}%;background:${sr}"></div></div>
      <div class="tuk-list">${sinyaller.map((s,i)=>
        `<div class="tuk ${i<tuk?'on':''}"><i style="background:${i<tuk?sr:'var(--dim)'}"></i>${s}</div>`).join('')}</div>
      ${surec.uyari?`<div style="font-size:11px;color:${sr};margin-top:11px;font-weight:600;line-height:1.4">⚠ ${surec.uyari}</div>`:''}
    </div>`;
  }

  // KATMAN RADARI
  const guvensiz=(rj==='VERI_GUVENSIZ'||rj==='VERI_BEKLENIYOR');
  let katHtml='';
  if(!guvensiz&&p){
    const kat=(ad,alt,guc,durum,renk)=>{
      const dRenk=durum==='VETO'?'var(--veto)':durum==='GÜÇLÜ'||durum==='TEYİTLİ'||durum==='SAĞLIKLI'?'var(--sonar)':
        durum==='ZAYIF'||durum==='TEYİTSİZ'?'var(--amber)':'var(--dim)';
      const dBg=durum==='VETO'?'rgba(255,138,61,.13)':dRenk==='var(--sonar)'?'rgba(47,245,200,.12)':
        dRenk==='var(--amber)'?'rgba(255,194,75,.12)':'rgba(61,100,120,.10)';
      return `<div class="katman">
        <span class="kat-dot" style="background:${guc>.15?renk:'var(--dim)'};${guc>.15?'box-shadow:0 0 7px '+renk:''}"></span>
        <span class="kat-ad">${ad}<small>${alt}</small></span>
        <span class="kat-dur" style="color:${dRenk};background:${dBg}">${durum}</span></div>`;
    };
    const iG=Math.max(p.satis,p.alis), aG=Math.max(p.absL,p.absS);
    const teyit=p.teyitL||p.teyitS;
    const veto=(rj==='SHORT_SQUEEZE'||rj==='LONG_TASFIYE');
    const saglik=(rj==='TAZE_ALIM'||rj==='TAZE_SATIS');
    katHtml=`<div class="bolum-bas">Katman Radarı — Kanıt Hiyerarşisi</div>`+
      kat('İşlemler / CVD','Katman 2 — en güvenilir',iG,iG>.5?'GÜÇLÜ':iG>.15?'ZAYIF':'SESSİZ','var(--sonar)')+
      kat('Absorbsiyon','Katman 3 — duvar↔işlem',aG,aG>.45?'GÜÇLÜ':aG>.2?'ZAYIF':'SESSİZ','var(--whale)')+
      kat('Duvar','Katman 1 — spoofa açık',teyit?aG:.12,teyit?'TEYİTLİ':'TEYİTSİZ','var(--sonar)')+
      kat('Açık Pozisyon','Katman 4 — kırılganlık vetosu',veto?1:saglik?.7:.2,
          veto?'VETO':saglik?'SAĞLIKLI':'SESSİZ',veto?'var(--veto)':'var(--sonar)');
  }

  document.getElementById('icerik').innerHTML=`
    <div class="fiyat-kart">
      <div class="fiyat">$${fmt(L.anlik_fiyat,0)}</div>
      <div class="fiyat-alt">
        <span style="color:${dF>=0?'var(--sonar)':'var(--alarm)'}">${dF>=0?'▲':'▼'} %${Math.abs(dF).toFixed(2)}</span>
        <span style="color:var(--dim)">5 dakika</span>
      </div>
    </div>

    <div class="sinyal-kart" style="border-color:${sRenk};background:${sBg}">
      <div class="sinyal-buyuk" style="color:${sRenk}">${sig}</div>
      <div class="sinyal-alt" style="color:${sRenk}">
        ${sig==='BEKLE'?`kanaat %${kanaat.toFixed(0)} · eşik 90`:`kanaat %${kanaat.toFixed(0)} · SİNYAL AKTİF`}
      </div>
    </div>

    <div class="rejim" style="border-color:${R.r};background:${R.bg}">
      <div class="rejim-ad" style="color:${R.r}">${R.ad}</div>
      <div class="rejim-not">${R.n}</div>
    </div>

    ${surecHtml}

    <div class="isabet">
      <span class="is-oran" style="color:${iRenk}">%${isabetOran.toFixed(0)}</span>
      <span class="is-txt">Geri test isabeti<br>${win}/${iw.length} doğru · %50 = yazı-tura</span>
    </div>

    <div class="grid">
      <div class="kutu ${vcd>0?'pos':vcd<0?'neg':'neu'}">
        <div class="k-lbl">Vadeli CVD</div>
        <div class="k-val ${vcd>0?'pos':vcd<0?'neg':'neu'}">${bigS(vcd)}</div>
        <div class="k-sub">${vGuv?'Coinalyze · USD':'⚠ yedek kaynak'}</div>
      </div>
      <div class="kutu ${scd>0?'pos':scd<0?'neg':'neu'}">
        <div class="k-lbl">Spot CVD</div>
        <div class="k-val ${scd>0?'pos':scd<0?'neg':'neu'}">${bigS(scd)}</div>
        <div class="k-sub">${sGuv?'Coinalyze · USD':'⚠ yedek kaynak'}</div>
      </div>
      <div class="kutu ${(bid-ask)>0?'pos':'neg'}">
        <div class="k-lbl">Derinlik Dengesi</div>
        <div class="k-val ${(bid-ask)>0?'pos':'neg'}">${bigS(bid-ask)}</div>
        <div class="k-sub">bid ${big(bid)} / ask ${big(ask)}</div>
      </div>
      <div class="kutu violet">
        <div class="k-lbl">Açık Pozisyon</div>
        <div class="k-val violet">${big(L.open_interest)}</div>
        <div class="k-sub">${p?`5dk ${p.dOI>=0?'+':''}${p.dOI.toFixed(2)}%`:'5 borsa'}</div>
      </div>
      <div class="kutu ${fund>0.0005?'warn':fund<-0.0002?'violet':'neu'}">
        <div class="k-lbl">Funding</div>
        <div class="k-val ${fund>0.0005?'warn':fund<-0.0002?'violet':'neu'}">${(fund*100).toFixed(3)}%</div>
        <div class="k-sub">${fund>0.0005?'kalabalık long':fund<-0.0002?'kalabalık short':'normal'}</div>
      </div>
      <div class="kutu ${(L.agg_long_liq||0)>(L.agg_short_liq||0)?'neg':'pos'}">
        <div class="k-lbl">Likidasyon</div>
        <div class="k-val neu" style="font-size:14px">${big(L.agg_long_liq)}<span style="color:var(--dim);font-size:11px"> / </span>${big(L.agg_short_liq)}</div>
        <div class="k-sub">long / short patlama</div>
      </div>
    </div>

    ${katHtml}

    <div class="bolum-bas">Likidite Duvarları (3 borsa)</div>
    ${tum.length?tum.map(x=>{
      const w=(x.usdt/maxU*100).toFixed(0);
      const c=x.t==='bid'?'var(--sonar)':'var(--alarm)';
      const mut=x.borsa||1;
      const mR=mut>=3?'var(--sonar)':mut===2?'var(--amber)':'var(--dim)';
      return `<div class="duvar">
        <span class="d-fiyat" style="color:${c}">$${fmt(x.fiyat,0)}</span>
        <span class="d-bar"><i style="width:${w}%;background:${c}"></i></span>
        <span class="d-usd">${big(x.usdt)}</span>
        <span class="d-mut" style="color:${mR};border-color:${mR}">${mut>=3?'3 brs':mut===2?'2 brs':'1 brs'}</span>
      </div>`;
    }).join(''):'<div style="color:var(--mist);font-size:12px;padding:8px">Duvar verisi yok.</div>'}
  `;

  const t=new Date(L.kayit_zamani);
  document.getElementById('dur').innerHTML=
    `<span class="pulse"></span>${t.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}`;
}

load();
setInterval(load,60000);
// Sayfa tekrar öne gelince yenile (telefonu cebe koyup çıkarınca)
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
</script>
</body>
</html>
